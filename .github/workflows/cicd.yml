name: GitHub Actions CI/CD Pipeline Flask App

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'v*' # Triggers on release tags like v1.0.0

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        pytest

    - name: Build Application Artifacts
      run: |
        echo "Preparing application artifacts for deployment..."

    - name: Deploy to Staging
      if: github.ref == 'refs/heads/staging'
      env:
        STAGING_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
      run: |
        echo "Deploying branch to staging environment using environment secrets..."

    - name: Deploy to Production
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
      run: |
        echo "Deploying tagged release to production environment..."
