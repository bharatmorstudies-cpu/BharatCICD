name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        pytest

    - name: Deploy to Staging
      if: github.ref == 'refs/heads/staging' && success()
      env:
        STAGE_API_KEY: ${{ secrets.STAGING_API_KEY }}
      run: |
        echo "Deploying to staging environment using secrets..."

    - name: Deploy to Production
      if: github.event_name == 'release' && success()
      env:
        PROD_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
      run: |
        echo "Deploying to production environment using secrets..."
